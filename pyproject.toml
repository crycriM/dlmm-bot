[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dlmm_bot"
version = "0.1.0"
description = "Dynamic Limit Order Market-Making bot for Meteora DLMM"
requires-python = ">=3.11"
dependencies = ["mm_core"]

[project.optional-dependencies]
dev = ["pytest>=7.4.0"]

[tool.setuptools.packages.find]
where = ["src"]
